<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart — Nearza</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header class="header">

    <div class="header-container">

        <!-- LOGO -->
        <a href="../index.html" class="logo">
            <span class="logo-icon">N</span>
            <span class="logo-text">Nearza</span>
        </a>

        <!-- LOCATION -->
        <button class="location-selector">
            <span class="location-icon">📍</span>

            <span class="location-content">
                <small>Deliver to</small>
                <strong>Ludhiana</strong>
            </span>

            <span class="location-arrow">⌄</span>
        </button>

        <!-- SEARCH -->
        <div class="search-container">

            <input
                type="text"
                class="search-input"
                placeholder="Search for products..."
            >

            <button class="search-button">
                🔍
            </button>

        </div>

        <!-- ACCOUNT -->
        <a href="../account.html" class="account-button">

            <span class="account-icon">👤</span>

            <span class="account-content">
                <small>Hello,</small>
                <strong>Account</strong>
            </span>

        </a>

        <!-- CART -->
        <a href="cart.html" class="cart-button">

            <span class="cart-icon">🛒</span>

            <span class="cart-text">Cart</span>

            <span class="cart-count">0</span>

        </a>

        <a href="orders.html" class="orders-link">
            Orders
        </a>

    </div>

</header>


<main>

    <section class="cart-page">

        <div class="cart-container">

            <!-- PAGE TITLE -->
            <div class="cart-header">

                <span class="section-label">YOUR SHOPPING CART</span>

                <h1>Your Cart</h1>

                <p>
                    Review your items before placing your order.
                </p>

            </div>


            <!-- CART CONTENT -->
            <div class="cart-layout">

                <!-- PRODUCTS -->
                <div class="cart-items">

                    <!-- JavaScript will add products here -->

                </div>


                <!-- ORDER SUMMARY -->
                <aside class="cart-summary">

                    <h2>Order Summary</h2>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <strong>₹0</strong>
                    </div>

                    <div class="summary-row">
                        <span>Delivery</span>
                        <strong>₹0</strong>
                    </div>

                    <div class="summary-divider"></div>

                    <div class="summary-total">
                        <span>Total</span>
                        <strong>₹0</strong>
                    </div>

                   <a href="checkout.html" class="checkout-button">
                          Proceed to Checkout
                   </a> 

                    <p class="delivery-note">
                        ⚡ Fast local delivery in 1–2 hours
                    </p>

                </aside>

            </div>

        </div>

    </section>

</main>
<script src="cart.js"></script>
</body>

</html>
